# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
#
# Minecraft moved to date-based versions: 1.21.11 -> 26.1.1 -> 26.1.2 -> 26.2
# Paper dropped the -R0.1-SNAPSHOT suffix. The format is <mc>.build.<n>-<channel>
# Channels: alpha -> beta -> stable. Keep the `build` part in version ranges so a
# newer major version is not pulled in by accident.

[versions]
paper = "26.2.build.129-stable"
junit-jupiter = "6.0.1"

[libraries]
# Shipped by the Paper server: `compileOnly`, never bundled into the jar.
# paper-api already exposes Guava, Gson, SnakeYAML, JOML, Brigadier and all of
# Adventure (adventure-api, adventure-key, adventure-text-minimessage, serializers)
# in compile scope, so they are inherited at compile time.
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
